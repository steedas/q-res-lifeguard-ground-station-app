[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "q-res-lifeguard-ground-station-app"
version = "0.1.0"
description = "VTOL rescue aircraft ground station"
requires-python = ">=3.10"
dependencies = ["PySide6==6.8.3", "pymavlink>=2.4.40,<3", "numpy>=1.21"]

[project.scripts]
lifeguard = "ground_station.app:main"

[tool.setuptools.packages.find]
include = ["ground_station*"]
